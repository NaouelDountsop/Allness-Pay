services:
  postgres:
    image: postgres:16-alpine
    container_name: afrilinkpay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-afrilinkpay}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-afrilinkpay}
      POSTGRES_DB: ${DB_DATABASE:-afrilinkpay}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-afrilinkpay} -d ${DB_DATABASE:-afrilinkpay}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: afrilinkpay-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: afrilinkpay-adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: afrilinkpay-api
    restart: unless-stopped
    ports:
      - '${API_PORT:-3000}:3000'
    env_file:
      - ./apps/api/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api/uploads:/app/uploads

volumes:
  postgres_data:
  redis_data: