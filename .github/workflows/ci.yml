name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck & tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: afrilinkpay
          POSTGRES_PASSWORD: afrilinkpay
          POSTGRES_DB: afrilinkpay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Construire le package partage
        run: npm run build:shared

      - name: Verifier le formatage
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Verification des types
        run: npm run typecheck

      - name: Tests unitaires
        run: npm test
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: afrilinkpay
          DB_PASSWORD: afrilinkpay
          DB_DATABASE: afrilinkpay_test
          JWT_ACCESS_SECRET: test-access-secret-minimum-32-caracteres-ok
          JWT_REFRESH_SECRET: test-refresh-secret-minimum-32-caracteres-ok

      - name: Build
        run: npm run build

  audit:
    name: Audit des dependances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
